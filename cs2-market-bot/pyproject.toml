[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-market-bot"
version = "0.1.0"
description = "Watch the CS2 Steam Community Market and buy listings priced below recent trade value."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gregory Santosa" }]

[project.scripts]
cs2-market-bot = "cs2_market_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
